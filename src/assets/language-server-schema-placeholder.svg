e" font-size="20">5</text><text x="102" y="296" fill="#d8cddd" font-family="monospace" font-size="21">}</text><rect x="292" y="326" width="620" height="112" rx="10" fill="#fffaf1"/><text x="324" y="366" fill="#dd4c14" font-family="monospace" font-size="18">SCHEMA DIAGNOSTIC</text><text x="324" y="405" fill="#261c2d" font-family="monospace" font-size="19">schemaVersion must be a string.</text><rect x="40" y="610" width="1120" height="48" rx="5" fill="#342b3e"/><text x="65" y="641" fill="#f6b33d" font-family="monospace" font-size="17">PLACEHOLDER — replace with an editor capture</text></svg>