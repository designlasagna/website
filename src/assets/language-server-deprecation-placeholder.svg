<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Placeholder: deprecation guidance in an editor</title><desc id="desc">A stylized code editor showing a deprecated CSS token and a quick-fix panel.</desc><rect width="1200" height="700" rx="22" fill="#1f1a24"/><rect width="1200" height="54" rx="22" fill="#342b3e"/><circle cx="36" cy="27" r="8" fill="#dd4c14"/><circle cx="62" cy="27" r="8" fill="#f6b33d"/><circle cx="88" cy="27" r="8" fill="#8342b0"/><text x="600" y="33" fill="#fffaf1" font-family="monospace" font-size="18" text-anchor="middle">button.css — Design System Language Server</text><rect x="0" y="54" width="1200" height="646" fill="#261c2d"/><text x="52" y="135" fill="#6e6276" font-family="monospace" font-size="20">12</text><text x="100" y="135" fill="#d8cddd" font-family="monospace" font-size="22">.button {</text><text x="52" y="180" fill="#6e6276" font-family="monospace" font-size="20">13</text><text x="100" y="180" fill="#d8cddd" font-family="monospace" font-size="22">  color: var(</text><text x="250" y="180" fill="#f6b33d" font-family="monospace" font-size="22">--ds-color-action-old</text><text x="526" y="180" fill="#d8cddd" font-family="monospace" font-size="22">);</text><path d="M250 191 H515" stroke="#dd4c14" stroke-width="4" stroke-dasharray="7 5"/><text x="52" y="225" fill="#6e6276" font-family="monospace" font-size="20">14</text><text x="100" y="225" fill="#d8cddd" font-family="monospace" font-size="22">}</text><rect x="208" y="246" width="690" height="190" rx="10" fill="#fffaf1"/><text x="240" y="290" fill="#dd4c14" font-family="monospace" font-size="18">⚠ DEPRECATED TOKEN</text><text x="240" y="332" fill="#261c2d" font-family="monospace" font-size="20">Scheduled for removal in 28 days.</text><text x="240" y="368" fill="#261c2d" font-family="monospace" font-size="20">Use --ds-color-action-primary instead.</text><rect x="240" y="386" width="440" height=