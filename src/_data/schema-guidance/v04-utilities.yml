# Reader-facing guidance for the v0.4 utilities schema reference.
#
# Top-level scopes match the property groups exposed by
# scripts/schema-reference.mjs for @designlasagna/schemas v0.4/utilities.json:
#   - manifest          the root manifest object
#   - definition names  the nested definitions (DesignSystemMeta, Category,
#                       UtilityClass, UtilityVariants, VariantPatterns,
#                       PlatformUtility, and Docs)
#   - _definitions      intro paragraphs for the nested definitions
#
# Keep every field of a scope present, even when unchanged: the coverage
# test treats a missing field as a regression. Use `example` (an object)
# for concrete snippet content.
v04Utilities:
  manifest:
    $schema:
      summary: "Identifier of the schema that validates the manifest."
      useWhen: "Always set it so editors and validators can find the contract."
      provenance: "Contract metadata; set by authors or generators."
      example:
        $schema: "https://designlasagna.recipes/schemas/v0.4/utilities.json"
    schemaVersion:
      summary: "Schema version the manifest conforms to."
      useWhen: "Keep it in sync with the $schema document the manifest is validated against."
      provenance: "Contract metadata; set by authors or generators."
      related: ["$schema"]
      example:
        schemaVersion: "0.4.0"
    generatedAt:
      summary: "ISO 8601 timestamp identifying the generation run that produced the manifest."
      useWhen: "Set by generators so consumers can detect and track stale manifests."
      provenance: "Computed by analysis or build tooling."
      example:
        generatedAt: "2026-01-15T08:30:00Z"
    designSystem:
      summary: "Identity of the design system the manifest describes."
      useWhen: "Help tooling label, group, and switch between design systems."
      provenance: "Authored metadata, carried through by generators."
      related: ["generatedAt"]
      example:
        designSystem:
          name: "Design Lasagna"
          version: "1.0.0"
          package: "@designlasagna/design-system"
    variantPatterns:
      summary: "Declared state and responsive variant patterns available to utilities."
      useWhen: "Let tooling generate and recognise variant names such as `hover:grid` or `sm:grid`."
      provenance: "Generated from variant configuration."
      related: ["utilities", "categories"]
      example:
        variantPatterns:
          states:
            hover:
              format: "hover:{utility}"
              description: "Applies while the element is hovered."
          responsive:
            breakpoints:
              - "sm"
              - "md"
            format: "sm:{utility}"
    categories:
      summary: "Category-grouped manifest branch; the alternative to the flat utilities list."
      useWhen: "Use when utilities are organised into named categories for browsing and autocomplete grouping."
      provenance: "Generated from authored definitions."
      related: ["utilities"]
      example:
        categories:
          - name: "Layout"
            prefix: "layout"
            utilities:
              - name: "layout:grid"
    utilities:
      summary: "Flat manifest branch listing utility classes; the alternative to the categories list."
      useWhen: "Use when the manifest declares utility classes without category grouping."
      provenance: "Generated from authored utility definitions."
      related: ["categories", "variantPatterns"]
      example:
        utilities:
          - name: "layout:grid"
  DesignSystemMeta:
    name:
      summary: "Display name of the design system."
      useWhen: "Identify the design system in documentation and tooling."
      provenance: "Authored metadata."
      example:
        name: "Design Lasagna"
    version:
      summary: "Version of the design system."
      useWhen: "Track which design-system version a manifest describes."
      provenance: "Authored metadata; maintained with releases."
      example:
        version: "1.0.0"
    documentation:
      summary: "Documentation links for the design system."
      useWhen: "Point consumers to the design system's documentation."
      provenance: "Authored metadata."
      example:
        documentation: "https://designlasagna.recipes/docs"
    package:
      summary: "Package identifier of the design system."
      useWhen: "Map the manifest to its published package."
      provenance: "Authored metadata."
      example:
        package: "@designlasagna/design-system"
    docsTemplates:
      summary: "URL templates for generating documentation links."
      useWhen: "Configure how tooling builds documentation links for utilities."
      provenance: "Authored metadata."
      example:
        docsTemplates:
          url: "/docs/utilities/{name}"
  Category:
    name:
      summary: "Human-readable name of the utility category."
      useWhen: "Always provide it; it names the group in documentation and UI."
      provenance: "Authored metadata."
      related: ["description", "prefix"]
      example:
        name: "Layout"
    description:
      summary: "Description of what the category covers."
      useWhen: "Use to help readers choose the right category at a glance."
      provenance: "Authored metadata."
      related: ["name"]
      example:
        description: "Utilities that control layout."
    prefix:
      summary: "Common utility name prefix shared by this category."
      useWhen: "Use when tools should recognise related utilities by naming."
      provenance: "Authored metadata."
      related: ["name", "utilities"]
      example:
        prefix: "layout"
    utilities:
      summary: "The utility classes belonging to this category."
      useWhen: "Always list the utilities so category browsing stays complete."
      provenance: "Generated from authored definitions."
      related: ["name"]
      example:
        utilities:
          - name: "layout:grid"
            status: "stable"
  UtilityClass:
    name:
      summary: "Stable utility identifier, such as a utility name."
      useWhen: "Always provide it; consumers use it as the durable utility identity."
      provenance: "Authored metadata."
      related: ["description", "keywords"]
      example:
        name: "layout:grid"
    description:
      summary: "Human-readable description of what the utility does."
      useWhen: "Use to give implementers the intent that a name cannot convey."
      provenance: "Authored metadata."
      related: ["name", "keywords"]
      example:
        description: "Arrange content on a CSS grid."
    status:
      summary: "Lifecycle status from the shared v0.4 lifecycle fragment; 'deprecated' and 'removed' are normative, other values are informational."
      useWhen: "Declare the normative lifecycle state of the utility, or carry informational states such as 'stable' or 'experimental'."
      provenance: "Authored metadata."
      related: ["deprecated"]
      example:
        status: "stable"
    exclusiveGroup:
      summary: "Names the group of mutually exclusive utilities."
      useWhen: "Use when only one utility in a set should be applied at a time, such as display modes."
      provenance: "Authored metadata."
      related: ["name"]
      example:
        exclusiveGroup: "display"
    variants:
      summary: "Variant support for this utility: state and responsive flags."
      useWhen: "Use to advertise the state and responsive variants of this utility in autocomplete."
      provenance: "Authored metadata."
      related: ["status"]
      example:
        variants:
          responsive: true
    priority:
      summary: "Sort weight for autocomplete, from 0 (lowest) to 100 (highest)."
      useWhen: "Use to surface the most common utilities first in tooling."
      provenance: "Authored metadata."
      related: ["keywords"]
      example:
        priority: 80
    keywords:
      summary: "Natural-language synonyms and search terms."
      useWhen: "Use to improve discovery in autocomplete and documentation search."
      provenance: "Authored metadata."
      related: ["description", "name"]
      example:
        keywords:
          - "layout"
          - "grid"
    since:
      summary: "Version or date when the utility was introduced."
      useWhen: "Use to make compatibility and migration decisions."
      provenance: "Authored metadata."
      related: ["status", "deprecated"]
      example:
        since: "1.2.0"
    docs:
      summary: "Links to the utility's supporting documentation."
      useWhen: "Use when readers need to continue to design-system guidance outside the manifest."
      provenance: "Authored metadata."
      related: ["description"]
      example:
        docs:
          url: "https://designlasagna.recipes/docs/utilities/layout-grid"
    platforms:
      summary: "Platform-specific implementations, keyed by platform identifier."
      useWhen: "Use when a utility is realised differently per platform, such as a class name and CSS properties on the web."
      provenance: "Generated or authored mapping."
      related: ["properties"]
      example:
        platforms:
          web:
            className: "layout:grid"
            properties:
              display: "grid"
    properties:
      summary: "Deprecated in v0.3. Maps CSS property names to utility values; new manifests should use `platforms.web.properties` instead."
      useWhen: "Read it for legacy manifests only; do not add it to new ones."
      provenance: "Legacy authored mapping."
      related: ["platforms"]
      example:
        properties:
          display: "grid"
    tokens:
      summary: "Token identifiers this utility references."
      useWhen: "Use to connect a utility back to the design tokens it consumes."
      provenance: "Generated from utility evaluation."
      related: ["name"]
      example:
        tokens:
          - "spacing.400"
    deprecated:
      summary: "Native deprecation record from the shared v0.4 lifecycle fragment; may be false, null, or a record with a required message."
      useWhen: "Guide consumers away from a utility while it remains available, recording its replacement and removal target."
      provenance: "Authored metadata."
      related: ["status", "since"]
      example:
        deprecated:
          message: "Use layout:grid instead."
          replacement: "layout:grid"
  UtilityVariants:
    states:
      summary: "State variant support: true for all declared states, or a subset of state names."
      useWhen: "Use to advertise state variants such as `hover:` for one specific utility."
      provenance: "Authored metadata."
      related: ["responsive"]
      example:
        states:
          - "hover"
          - "focus"
    responsive:
      summary: "Whether this utility supports responsive breakpoint variants."
      useWhen: "Use when the utility is offered under breakpoint prefixes such as `sm:` and `md:`."
      provenance: "Authored metadata."
      related: ["states"]
      example:
        responsive: true
  VariantPatterns:
    states:
      summary: "Declared pseudo-state variants, keyed by state name."
      useWhen: "Use when utilities support state forms such as `hover:` or `focus:` and tools should generate them."
      provenance: "Generated from variant configuration."
      related: ["responsive"]
      example:
        states:
          hover:
            format: "hover:{utility}"
            description: "Applies while the element is hovered."
    responsive:
      summary: "Declared responsive breakpoints and naming form for utility variants."
      useWhen: "Use when utilities support breakpoint variants like `sm:`."
      provenance: "Generated from breakpoint configuration."
      related: ["states"]
      example:
        responsive:
          breakpoints:
            - "sm"
            - "md"
          format: "sm:{utility}"
  PlatformUtility:
    className:
      summary: "The class name that expresses the utility on this platform."
      useWhen: "Use when the platform applies the utility through a class."
      provenance: "Generated or authored mapping."
      related: ["modifier", "properties"]
      example:
        className: "layout:grid"
    modifier:
      summary: "The modifier token the platform combines with a base class to express the utility."
      useWhen: "Use when the platform names utilities as a base class plus a modifier, rather than a single class name."
      provenance: "Generated or authored mapping."
      related: ["className"]
      example:
        modifier: "grid"
    style:
      summary: "A style fragment the platform attaches to express the utility."
      useWhen: "Use when the platform realises the utility through inline or embedded style text."
      provenance: "Generated or authored mapping."
      related: ["properties"]
      example:
        style: "display: grid; grid-template-columns: repeat(4, 1fr);"
    properties:
      summary: "CSS properties and values that realise the utility on this platform."
      useWhen: "Use when tooling needs the underlying declarations to apply or preview the utility."
      provenance: "Generated from utility evaluation."
      related: ["className"]
      example:
        properties:
          display: "grid"
  Docs:
    url:
      summary: "Primary documentation page for this item."
      useWhen: "Provide it as the canonical destination for detailed guidance."
      provenance: "Authored metadata."
      related: ["figma", "storybook"]
      example:
        url: "https://designlasagna.recipes/docs/utilities/layout-grid"
    figma:
      summary: "Figma reference for the design or component."
      useWhen: "Use when implementers need to compare the rendered result with the design source."
      provenance: "Authored metadata."
      related: ["url"]
      example:
        figma: "https://figma.com/file/designlasagna/utilities"
    storybook:
      summary: "Storybook reference for live component states."
      useWhen: "Use when readers benefit from interactive examples."
      provenance: "Authored metadata."
      related: ["url"]
      example:
        storybook: "https://storybook.designlasagna.recipes/?path=/story/utilities--grid"
  _definitions:
    Category:
      summary: "A named grouping of utilities, carrying display metadata and the utility records that belong to the group."
      useWhen: "Use when the manifest organises utilities into browsable categories."
      provenance: "Defined by the v0.4 utilities schema."
    Deprecated:
      summary: "Deprecation record for a native manifest entity; defined in the shared lifecycle fragment (lifecycle.json) and referenced from this schema, permissive of unknown properties."
      useWhen: "Use when a utility is being phased out and needs a recorded reason, removal target, and replacement."
      provenance: "Defined in the shared v0.4 lifecycle fragment."
    DesignSystemMeta:
      summary: "Identity and discovery metadata for the design system that produced the manifest."
      useWhen: "Use when tooling needs to label, version, and document the design system."
      provenance: "Defined by the v0.4 utilities schema."
    Docs:
      summary: "Documentation and design-tool links for a utility."
      useWhen: "Use when readers need to continue from the manifest to deeper guidance."
      provenance: "Defined by the v0.4 utilities schema."
    PlatformUtility:
      summary: "How one utility is realised on a specific platform, such as a class name or style properties on the web."
      useWhen: "Use when tooling must apply the utility faithfully per platform."
      provenance: "Defined by the v0.4 utilities schema."
    UtilityClass:
      summary: "One utility record: its identity, lifecycle status, variant support, and per-platform realisation."
      useWhen: "Use for every utility declared in the manifest."
      provenance: "Defined by the v0.4 utilities schema."
    UtilityVariants:
      summary: "Per-utility variant support flags, recording which states and whether responsive variants apply to this utility."
      useWhen: "Use to advertise one utility's variant support in autocomplete, separately from the shared variant vocabulary."
      provenance: "Defined by the v0.4 utilities schema."
    VariantPatterns:
      summary: "The declared state and responsive variant naming patterns a manifest supports, letting tools generate and recognise names like `hover:grid` or `sm:grid`."
      useWhen: "Use when utilities are offered with state or breakpoint variants and tooling should generate them."
      provenance: "Defined by the v0.4 utilities schema."
