# Reader-facing guidance for the v0.4 lifecycle fragment (v0.4/lifecycle.json).
# The fragment is definitions-only: it has no manifest scope of its
# own, so only the property-bearing definitions get field scopes. Every
# definition is introduced in its own section on the reference page.
v04Lifecycle:
  Deprecated:
    message:
      summary: 'Required, human-readable deprecation reason plus migration guidance.'
      useWhen: 'Always set; it is the only required field of the record.'
      provenance: 'Canonical deprecation record field.'
      related:
        - removal
        - replacement
      example:
        message: 'Use the “ghost” variant instead.'
    removal:
      summary: 'Optional removal target: ISO date (YYYY-MM-DD), semver (X.Y.Z), or quarter (YYYY-Qn).'
      useWhen: 'When removal is planned; only ISO dates drive time-aware severity.'
      provenance: 'Canonical deprecation record field.'
      related:
        - message
      example:
        removal: '2027-01-01'
    replacement:
      summary: 'Optional machine-readable replacement identifier, scoped by entity type.'
      useWhen: 'When a drop-in replacement exists that tooling can point users at.'
      provenance: 'Canonical deprecation record field.'
      related:
        - message
      example:
        replacement: ghost
  StrictDeprecated:
    message:
      summary: 'Required, human-readable deprecation reason plus migration guidance.'
      useWhen: 'Always set; it is the only required field of the record.'
      provenance: 'DTCG extension namespace record field.'
      related:
        - removal
        - replacement
      example:
        message: 'Use the “ghost” variant instead.'
    removal:
      summary: 'Optional removal target: ISO date (YYYY-MM-DD), semver (X.Y.Z), or quarter (YYYY-Qn).'
      useWhen: 'When removal is planned; only ISO dates drive time-aware severity.'
      provenance: 'DTCG extension namespace record field.'
      related:
        - message
      example:
        removal: '2027-01-01'
    replacement:
      summary: 'Optional machine-readable replacement identifier, scoped by entity type.'
      useWhen: 'When a drop-in replacement exists that tooling can point users at.'
      provenance: 'DTCG extension namespace record field.'
      related:
        - message
      example:
        replacement: ghost
  DeprecatedValue:
    value:
      summary: 'The specific attribute value being deprecated.'
      useWhen: 'Always set for a DeprecatedValue record; it names the enum value.'
      provenance: 'CEM per-value deprecation record field.'
      related:
        - message
        - replacement
      example:
        value: flat
    message:
      summary: 'Required, human-readable deprecation reason plus migration guidance.'
      useWhen: 'Always set; it is required alongside value.'
      provenance: 'CEM per-value deprecation record field.'
      related:
        - value
        - replacement
      example:
        message: 'Use “ghost” instead.'
    removal:
      summary: 'Optional removal target: ISO date (YYYY-MM-DD), semver (X.Y.Z), or quarter (YYYY-Qn).'
      useWhen: 'When the value is scheduled for removal; only ISO dates drive time-aware severity.'
      provenance: 'CEM per-value deprecation record field.'
      related:
        - value
      example:
        removal: '2027-01-01'
    replacement:
      summary: 'Optional machine-readable replacement identifier; for CEM attribute values, an enum value of the same attribute.'
      useWhen: 'When a replacement enum value exists that tooling can point users at.'
      provenance: 'CEM per-value deprecation record field.'
      related:
        - value
      example:
        replacement: ghost
  _definitions:
    Status:
      summary: 'Plain string lifecycle status for a manifest entity.'
      useWhen: 'Set on tokens, utilities, icons, CEM declarations, attributes, and DTCG extension payloads.'
      provenance: 'Shared v0.4 status vocabulary; only deprecated and removed are normative.'
      related:
        - Deprecated
        - NativeDeprecation
      example:
        status: deprecated
    Deprecated:
      summary: 'Canonical deprecation record for native manifest entities; permissive on unknown properties.'
      useWhen: 'The record branch of NativeDeprecation, and the target of the local Deprecated aliases in tokens, utilities, and icons.'
      provenance: 'Shared v0.4 deprecation record.'
      related:
        - NativeDeprecation
        - StrictDeprecated
      example:
        message: 'Use the “ghost” variant instead.'
        removal: '2027-01-01'
        replacement: ghost
    StrictDeprecated:
      summary: 'Closed deprecation record for the DTCG extension namespace; unknown properties are rejected.'
      useWhen: 'DTCG $extensions deprecation payloads, where the extension contract is closed.'
      provenance: 'Shared v0.4 DTCG extension namespace record.'
      related:
        - Deprecated
      example:
        message: 'Use the “ghost” variant instead.'
        removal: '2027-01-01'
        replacement: ghost
    NativeDeprecation:
      summary: 'Union type for a native manifest deprecation field: false, null, or a Deprecated record.'
      useWhen: 'The deprecated field on tokens, utilities, and icons in v0.4 native manifests.'
      provenance: 'Shared v0.4 native deprecation pattern (deprecated plus status).'
      related:
        - Deprecated
        - Status
      example:
        deprecated:
          message: 'Use “lasagna-action-button” instead.'
          removal: '2027-01-01'
    DeprecatedValue:
      summary: 'Deprecation record for a specific attribute value in a CEM; permissive on unknown properties.'
      useWhen: 'Entries of deprecatedValues on CEM attribute entries extended by the v0.4 component schema.'
      provenance: 'Shared v0.4 CEM per-value deprecation record.'
      related:
        - Deprecated
      example:
        value: flat
        message: 'Use “ghost” instead.'
